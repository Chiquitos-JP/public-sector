# IMF World Economic Outlook（DataMapper API）の系列。id は imf.<指標コード>
# どれも国をまたぐパネル（country: ALL）で、見通し（未来の年）を含む（projection_years）。
# WEO は年 2 回の公表なので月 1 回だけ取り、毎回全期間を取り直す（過去の年も改定されるため）。
# IMF の利用条件で自動の一括ダウンロードは許可が要る。取得は月 1 回・指標ごとに 1 回の呼び出しに抑える

- id: imf.NGDP_RPCH
  title_ja: 実質 GDP 成長率（IMF WEO）
  title_en: "Real GDP growth"
  concept: real_gdp_growth
  coverage: weo_with_projections
  definition: "実質 GDP の前年比の伸び率（各国通貨建ての不変価格）"
  notes:
    - "IMF の World Economic Outlook（WEO）。年 2 回（4 月・10 月）の公表のたびに、過去の年も含めて全体が改定される。改定前の値は as_of で読める"
    - "見通し（未来の年）を含む。どの年から見通しかは国ごとに違う（最新の公表年の前後から推計・見通し）。実績として使うときは期間を確かめる"
  source_url: https://www.imf.org/external/datamapper/NGDP_RPCH@WEO
  creator: imf
  distributor: imf
  country: ALL
  freq: A
  unit: "%"
  unit_kind: percent
  price_basis: real
  seasonal_adjustment: NSA
  tier: stocked
  refetch_window: 70Y
  fetch_every: 30D
  projection_years: 7
  start: "1980-01-01"
  used_by:
    - u04
    - u05


  creator: worldbank
  distributor: wb
  country: ALL
  freq: A
  unit: "米ドル"
  unit_kind: currency
  unit_of: "per_capita"
  currency: USD
  price_basis: nominal
  seasonal_adjustment: NSA
  tier: stocked
  refetch_window: 70Y
  fetch_every: 7D
  start: "1960-01-01"
  used_by:
    - u04
    - u05


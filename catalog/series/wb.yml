- id: wb.SI.POV.DDAY
  title_ja: 貧困率（1 日 3.00 ドル未満・2021 年 PPP）
  title_en: "Poverty headcount ratio at $3.00 a day (2021 PPP) (% of population)"
  definition: "1 日 3.00 ドル未満（2021 年の購買力平価）で暮らす人の割合。世界銀行の国際貧困ライン"
  notes:
    - "家計調査がもとなので、調査のあった年しか値が無い（国によっては数年おき）"
    - "購買力平価の改定で貧困ラインが変わると過去の値も変わり、以前の版の値とは比べられない"
    - "所得で測る国と消費で測る国があり、国どうしの比較は目安"

    - u05

- id: wb.GC.NLD.TOTL.GD.ZS
  title_ja: 財政収支（純貸出・純借入、GDP 比）
  title_en: "Net lending (+) / net borrowing (-) (% of GDP)"
  concept: gov_balance_gdp
  coverage: central_government
  definition: "政府の財政収支（純貸出 / 純借入）の GDP 比。歳入 − 歳出 − 非金融資産への純投資。プラスが黒字、マイナスが赤字"
  notes:
    - "原典は IMF の Government Finance Statistics。対象は主に中央政府で、国によって地方政府を含むかが違う（一般政府の比較なら IMF WEO のほうがそろっている）"
    - "公表が遅く、最新は 2 年ほど前の年になる。収録している国も少ない"

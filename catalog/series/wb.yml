  creator: worldbank
  distributor: wb
  country: ALL
  freq: A
  unit: "% of GDP"
  unit_kind: percent
  unit_of: "GDP"
  seasonal_adjustment: NSA
  tier: stocked
  refetch_window: 70Y
  fetch_every: 7D
  start: "1960-01-01"
  original_source: "IMF, Government Finance Statistics"
  used_by:
    - u04
    - u05


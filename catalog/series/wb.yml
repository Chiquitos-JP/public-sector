  freq: A
  unit: "%"
  unit_kind: percent
  seasonal_adjustment: NSA
  tier: stocked
  refetch_window: 70Y
  fetch_every: 7D
  start: "1960-01-01"
  original_source: "IMF, International Financial Statistics"
  used_by:

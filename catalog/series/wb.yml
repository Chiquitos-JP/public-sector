- id: wb.FP.CPI.TOTL.ZG
  title_ja: 消費者物価上昇率
  title_en: "Inflation, consumer prices (annual %)"
  concept: inflation_avg
  coverage: actual
  definition: "消費者物価の前年比の上昇率（年平均）"
  notes:
    - "原典は IMF の International Financial Statistics。品目のかごや基準年は国ごとに違う"
    - "年平均どうしの比較なので、年末時点の上昇率（前年 12 月比）とは違う"
    - "ハイパーインフレの国は値が桁違いに大きくなるので、グラフでは軸の扱いに注意"

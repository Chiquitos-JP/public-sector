- id: wb.GC.DOD.TOTL.GD.ZS
  title_ja: 中央政府債務（GDP 比）
  title_en: "Central government debt, total (% of GDP)"
  concept: gov_debt_gdp
  coverage: central_government
  definition: "中央政府の債務残高の GDP 比（総額。国内・対外の両方）"

# 世界銀行 World Development Indicators の系列。id は wb.<指標コード>
# どれも国をまたぐパネル（country: ALL）。全ての国・地域を取り、比べる国は利用側で選ぶ（catalog/groups.yml）
# 年次で更新が少ないので週 1 回だけ取り、毎回全期間を取り直す（過去の年も改定されるため）

- id: wb.NY.GDP.MKTP.KD.ZG
  title_ja: 実質 GDP 成長率
  title_en: "GDP growth (annual %)"
  concept: real_gdp_growth
  coverage: actual
  definition: "実質 GDP の前年比の伸び率。物価の変動を除いた（2015 年基準の米ドル建て不変価格）経済規模の成長率"
  notes:
    - "各国の統計機関・中央銀行の国民経済計算がもとで、国によって基準年の改定や推計方法が違う"
    - "暦年と会計年度のどちらで集計しているかは国によって違う"
  source_url: https://data.worldbank.org/indicator/NY.GDP.MKTP.KD.ZG
  creator: worldbank
  distributor: wb
  country: ALL
  freq: A
  unit: "%"
  unit_kind: percent
  price_basis: real
  seasonal_adjustment: NSA
  tier: stocked
  refetch_window: 70Y
  fetch_every: 7D
  start: "1960-01-01"
  used_by:
    - u04
    - u05

- id: wb.NY.GDP.PCAP.CD
  title_ja: 1 人当たり GDP（名目・米ドル）
  title_en: "GDP per capita (current US$)"
  concept: gdp_per_capita_usd
  coverage: actual
  definition: "1 人当たり GDP（名目・米ドル建て）。名目 GDP を年央の人口で割った値"
  notes:
    - "物価も為替も調整していない。自国通貨が対ドルで下がると、経済が変わらなくても値が下がる"
    - "生活水準の比較には購買力平価（PPP）建てのほうが向く（ここには入れていない）"

- id: fred.DEXJPUS
  title_ja: 円/ドル為替レート（NY 正午）
  title_en: Japanese Yen to U.S. Dollar Spot Exchange Rate
  concept: usd_jpy
  coverage: ny_noon
  definition: "ドル円の為替相場。1 ドルあたりの円（ニューヨーク市場の正午の買い相場、FRB H.10）"
  notes:
    - "米国の営業日だけ。公表は週 1 回まとめて（翌週の月曜）なので、最新の値は数日遅れる"
    - "日銀の東京 17 時の相場（boj.FM08.FXERD04）とは時点が違うので、同じ日でも値がずれる"
  source_url: https://fred.stlouisfed.org/series/DEXJPUS
  creator: frb

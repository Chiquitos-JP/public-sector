# 作成元（収録基準 1・2）と配信元の台帳。
# 系列は creator にここの creators のキーを書く。載っていない作成元の系列は検証で落ちる。

# 再配布してよいライセンス（基準 2）。ここに無いライセンスの系列は検証で落ちる
allowed_licenses:
  public-domain: 米連邦政府の著作物など。著作権の制約なし
  attribution: 出典を明記すれば複製・転載・加工してよい
  cc-by-4.0: Creative Commons 表示 4.0。出典を明記すれば商用を含め複製・加工・再配布してよい
  imf-data-terms: IMF の Copyright and Usage（Special Terms for Statistical Data）。出典を明記すれば無料で再利用・公表してよい。商用の再利用と自動の一括ダウンロードは IMF の許可が要る

# 作成元（基準 1: 公的機関であること）
creators:
  frb:
    name: Board of Governors of the Federal Reserve System (US)
    kind: central_bank
    license: public-domain
    credit: "Board of Governors of the Federal Reserve System (US), retrieved from FRED"
  bls:
    name: U.S. Bureau of Labor Statistics
    kind: statistical_agency
    license: public-domain
    credit: "U.S. Bureau of Labor Statistics, retrieved from FRED"
  boj:
    name: 日本銀行
    kind: central_bank
    license: attribution
    credit: "出所：日本銀行「時系列統計データ」"
  worldbank:
    name: The World Bank
    kind: international_organization
    license: cc-by-4.0
    credit: "The World Bank: World Development Indicators (CC BY 4.0)"
  imf:
    name: International Monetary Fund
    kind: international_organization
    license: imf-data-terms
    credit: "Source: International Monetary Fund, World Economic Outlook database, https://www.imf.org/external/datamapper"

# 配信元（取得の経路。作成元とは別に扱う）
distributors:
  fred:
    name: FRED, Federal Reserve Bank of St. Louis
    url: https://fred.stlouisfed.org/
  boj:
    name: 日本銀行 時系列統計データ検索サイト API
    url: https://www.stat-search.boj.or.jp/
  imf:
    name: IMF DataMapper API
    url: https://www.imf.org/external/datamapper/
  wb:
    name: World Bank Indicators API
    url: https://data.worldbank.org/

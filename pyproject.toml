[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psdata"
version = "0.1.0"
description = "公開統計の取得・整形・カタログ（public-sector）"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "pyyaml>=6",
    "openpyxl>=3.1",  # Excel への書き出し（client.export）
    "duckdb>=1.4",  # SQL で読む（client.sql）
    "pycountry>=24.6",  # 国名の日本語（ISO 3166）
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

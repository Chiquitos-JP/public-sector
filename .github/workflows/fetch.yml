# 常備系列の定期取得。R2（public-sector-data）に書くのはこのワークフローだけ。
#
# 流れ: R2 から bronze を取り込む → 取り直し（改定対応）→ silver 再構築 → 検証 → R2 へ書く → 古い raw を消す
# 1 系列の取得に失敗しても、検証を通った他の系列は書く。そのうえでジョブは失敗にする。
name: fetch

on:
  schedule:
    # 本命は 12:17 JST: 日銀の 12 時の更新のあとで、FRED の前夜分（06:31 JST までに出そろう）も入っている。
    # 予備は 06:47 JST: GitHub の定時実行は数時間遅れることがある（2026-11 に約 6 時間遅れが続いた）ので 2 本にする。
    # 取り直しは冪等で、週 1 回・月 1 回の系列は間隔で飛ばすので、2 回走っても害はない。毎時 0 分は混むので避ける
    - cron: "17 3 * * *" # 毎日 12:17 JST（本命）
    - cron: "47 21 * * *" # 毎日 06:47 JST（予備）
  workflow_dispatch:
    inputs:
      full:
        description: "定義上の開始日から全期間を取り直す"
        type: boolean
        default: false
      ids:
        description: "取り直す系列 id（空白区切り。空なら常備の全系列。指定した系列は週 1 回・月 1 回の間隔にかかわらず取る）"
        type: string
        default: ""

concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # 下の Keep schedule enabled 用

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}  # e-Stat の系列を足したときに使う
      RCLONE_CONFIG_PS_TYPE: s3
      RCLONE_CONFIG_PS_PROVIDER: Cloudflare
      RCLONE_CONFIG_PS_ACCESS_KEY_ID: ${{ secrets.PS_R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_PS_SECRET_ACCESS_KEY: ${{ secrets.PS_R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_PS_ENDPOINT: ${{ secrets.PS_R2_ENDPOINT }}
      RCLONE_CONFIG_PS_REGION: auto
      RCLONE_CONFIG_PS_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_PS_ACL: private
      REMOTE: ps:public-sector-data
      # raw（応答そのまま）の保存日数。過ぎたものは消す。bronze・silver・logs は消さない
      RAW_KEEP_DAYS: "90"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          rclone version

      - name: Test
        run: python -m pytest -q

      - name: Pull bronze from R2
        run: rclone copy "$REMOTE/bronze" data/bronze --transfers 8

      - name: Fetch
        id: fetch
        env:
          IDS: ${{ inputs.ids }}
        # 公開ログには件数だけを出し、詳細は保存先の logs/ に置く
        run: |
          mkdir -p logs
          set +e
          # ids は env 経由で渡す（入力をそのままシェルに埋め込まない）。空白で分けて引数にする
          python scripts/fetch.py ${{ inputs.full && '--full' || '' }} $IDS > logs/fetch.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "成功 $(grep -c '^  ✅' logs/fetch.log) / 失敗 $(grep -c '^  ❌' logs/fetch.log)"

      - name: Validate
        run: |
          set +e
          python scripts/validate.py > logs/validate.log 2>&1
          rc=$?
          set -e
          tail -n 1 logs/validate.log
          exit "$rc"

      # 目録（持っている系列と表の一覧）。ダッシュボードはこれを読んで差し替える
      - name: Build catalogue summary
        run: python scripts/catalog_summary.py data/docs/catalog > /dev/null

      - name: Push to R2
        run: |
          for layer in raw bronze silver docs; do
            rclone copy "data/$layer" "$REMOTE/$layer" --transfers 8
          done

      - name: Prune old raw
        run: rclone delete "$REMOTE/raw" --min-age "${RAW_KEEP_DAYS}d"

      - name: Push logs to R2
        if: always()
        run: rclone copy logs "$REMOTE/logs/$(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }}"

      # 公開リポジトリの定期実行は、リポジトリに 60 日間更新がないと自動で止まる。
      # データの書き込み先は R2 でコミットが起きないため、実行のたびに有効化し直す
      - name: Keep schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fetch.yml/enable"

      - name: Fail if any series failed
        if: steps.fetch.outputs.rc != '0'
        run: |
          echo "::error::取得に失敗した系列がある（詳細は保存先の logs/）"
          exit 1
